[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automonetize"
version = "0.1.0"
description = "Autonomous, goal-directed agent loop targeting $10/day net revenue with zero startup capital."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
automonetize = "dashboard.cli:main"

[tool.setuptools.packages.find]
include = ["agent*", "strategies*", "tools*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
