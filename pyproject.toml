[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automonetize"
version = "0.1.0"
description = "Autonomous, goal-directed agent loop targeting $10/day net revenue with zero startup capital."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13", "aiohttp>=3.9", "stripe>=8"]

[project.optional-dependencies]
dev = ["pytest>=7", "Pillow>=10.1"]
images = ["Pillow>=10.1"]

[project.scripts]
automonetize = "dashboard.cli:main"

[tool.setuptools.packages.find]
include = ["agent*", "strategies*", "tools*", "dashboard*", "gui*"]

[tool.setuptools.package-data]
gui = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
